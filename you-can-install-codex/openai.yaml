# Empeche le chargement implicite de ce skill.
#
# Ecrire "ce skill est explicite" dans le SKILL.md ne suffit pas : Codex le
# charge quand meme des que la description correspond. Constate en direct
# pendant la redaction de ce skill, il s est auto-invoque sur un simple message
# qui parlait du duo.
#
# Emplacement a confirmer : Codex l a indique comme "agents/openai.yaml". Il est
# ici, dans le dossier du skill, parce que la regle ne concerne que ce skill. Si
# le chargement implicite se produit encore, essayer .agents/openai.yaml.
policy:
  allow_implicit_invocation: false
